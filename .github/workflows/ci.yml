name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 新たに公開された脆弱性を検知するため毎週月曜に実行
    - cron: "0 0 * * 1"

# ワークフロー全体の GITHUB_TOKEN 権限は付与せず、ジョブごとに最小限だけ与える
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # サプライチェーン攻撃対策としてアクションはコミットSHAで固定
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # lockfile どおりにインストールする（install スクリプトは .npmrc で無効化済み）
      - run: npm ci

      # 既知の脆弱性と、レジストリ署名・来歴（provenance）の検証
      - run: npm run security:audit

      - run: npm test

      - run: npm run build
