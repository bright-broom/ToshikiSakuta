version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 公開直後の悪意あるバージョン（乗っ取り等）を取り込まないよう、公開から一定期間待ってから更新する
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # 同時に更新しないとインストールやビルドが壊れるパッケージは、メジャー更新も含めて 1 つの PR にまとめる。
    # パッケージは最初に一致したグループに入るため、個別グループを先に、残りのマイナー・パッチ更新を最後に定義する
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      font-awesome:
        patterns: ["@fortawesome/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      lint:
        patterns: ["eslint", "typescript", "@types/node"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
